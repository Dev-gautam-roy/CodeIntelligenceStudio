[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel-backend"
version = "0.1.0"
description = "Autonomous AI Software Engineering & Repository Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dev Gautam Roy", email = "devgautamroyxa@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = [".", "app"]
