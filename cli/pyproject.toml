[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel-cli"
version = "0.1.0"
description = "Autonomous AI Software Engineering Platform CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0"
]

[project.scripts]
codeintel = "codeintel.main:app"
